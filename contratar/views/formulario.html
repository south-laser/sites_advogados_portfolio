  <h1>{{titulo}}</h1>
  <p class="lead">{{descricao}}</p>

  <section>
    <h2>O que você está contratando</h2>
    <div class="price">
      <strong>{{preco}}</strong>
      <span>{{cobranca}}</span>
    </div>
    {{{prazo_html}}}

    <h3>O que será entregue</h3>
    {{{entregaveis_html}}}
    {{{nao_inclui_html}}}
  </section>

  <form method="post" action="/?tipo={{tipo_url}}" novalidate>
    <input type="hidden" name="csrf" value="{{csrf}}">
    <input type="hidden" name="tipo" value="{{tipo}}">

    {{{erros_html}}}

    <section>
      <h2>Seus dados</h2>
      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" autocomplete="name" required value="{{nome}}">
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="voce@exemplo.com.br" required value="{{email}}">
      </div>
      <div class="field">
        <label for="telefone">Telefone com DDD</label>
        <input type="tel" id="telefone" name="telefone" inputmode="numeric" autocomplete="tel-national" placeholder="(51) 99999-9999" required value="{{telefone}}">
      </div>
      <div class="field">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required value="{{cpf}}">
      </div>
    </section>

    <section>
      <h2>Termos e condições</h2>
      <div class="terms" tabindex="0" aria-label="Termos e condições">
        {{{termos_html}}}
      </div>
      <label class="aceite">
        <input type="checkbox" name="aceite" value="1" required>
        <span>Li e aceito os termos e condições, o serviço e o valor descritos nesta página.</span>
      </label>
      <button class="go" type="submit">Aceitar e contratar</button>
    </section>
  </form>
